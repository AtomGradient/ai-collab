[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-collab"
version = "0.1.0.dev0"
description = "Local Multi-Agent Scenario Harness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AtomGradient"}]
dependencies = [
    "platformdirs>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-collab = "ai_collab.cli:main"
ai-collab-host = "ai_collab.service:main"
ai-collab-participant = "ai_collab.participant_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: full provisioning cycles that build real venvs and clones",
]
